<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>競馬ゲーム（次へで次のオッズ）</title>
<style>
  body{font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:#f4f4f4;margin:0;padding:12px;color:#111}
  h2{margin:0 0 10px;background:#0b8f3c;color:#fff;padding:10px;border-radius:12px}
  h3{margin:0 0 8px}
  .box{background:#fff;border:1px solid #ddd;border-radius:12px;padding:10px;margin:10px 0}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  button{border:0;border-radius:10px;padding:10px 12px;background:#0b8f3c;color:#fff;font-weight:900}
  button.secondary{background:#333}
  button:disabled{opacity:.45}
  select,input{border:1px solid #ccc;border-radius:10px;padding:8px}
  .muted{color:#666;font-size:13px;line-height:1.5}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;border:1px solid #cfe6ff;background:#eef6ff;color:#0a4a8a;margin-left:6px}
  .bad{border-color:#ffb3b3;background:#ffecec;color:#7a0000}
  .ok{border-color:#b9f2b9;background:#eaffea;color:#0b5a0b}
  pre{white-space:pre-wrap;background:#111;color:#eee;border-radius:12px;padding:10px;overflow:auto}

  .table{width:100%;border-collapse:collapse;font-size:14px}
  .table th,.table td{border-bottom:1px solid #eee;padding:6px 6px;text-align:left;vertical-align:top}
  .table th{background:#f2f2f2}
  .right{text-align:right}

  /* レース見やすさ（間隔を詰める） */
  #race{display:grid;gap:2px;max-height:55vh;overflow:auto}
  .laneBox{background:#fff;border:1px solid #ddd;border-radius:12px;padding:4px}

  /* 馬番：丸＋塗りつぶし */
  .laneHead{
    width:30px;height:30px;border-radius:999px;
    display:inline-flex;align-items:center;justify-content:center;
    font-weight:900;color:#fff;
    background:var(--badge, #0b8f3c);
    border:2px solid var(--badge, #0b8f3c);
    box-shadow:0 2px 6px rgba(0,0,0,.15);
    margin-bottom:3px;
  }

  .track{
    position:relative;height:24px;border-radius:12px;overflow:hidden;margin-top:2px;
    background:linear-gradient(#141414,#101010),
      repeating-linear-gradient(90deg, rgba(255,255,255,.08) 0 1px, transparent 1px 72px);
    background-size:100% 100%,72px 100%;
    background-position:0 0,var(--bgx,0px) 0;
  }
  .finish{position:absolute;right:10px;top:0;width:3px;height:100%;background:#fff;opacity:.85}
  .horse{
    position:absolute;left:0%;top:3px;font-size:18px;user-select:none;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));
    transform-origin:center;
  }
</style>
</head>
<body>
<h2>🏇 競馬ゲーム（「次へ」で次のオッズ）</h2>

<div class="box">
  <div class="row">
    <button id="btnStart" class="secondary" onclick="startRace()" disabled>レース開始（締切）</button>
    <button id="btnNext" class="secondary" onclick="nextRace()" disabled>次へ（次のオッズ）</button>
    <button class="secondary" onclick="resetAll()">リセット</button>
  </div>
  <div class="muted" style="margin-top:8px">
    ・最初は自動でオッズ作成（ボタンなし）<br>
    ・レース終了後に <b>「次へ」</b> を押すと次のオッズが作られる<br>
    ・レース欄は <b>馬番だけ（丸＋色）</b> / 🐎は <b>左→右に必ず走る</b>
  </div>
</div>

<div class="box" id="playersBox"></div>
<div class="box" id="infoBox"></div>
<div class="box" id="oddsBox"></div>

<div class="box">
  <h3>🎟️ 賭け</h3>
  <div id="betBox"></div>
  <div id="lockedBox" class="muted"></div>
</div>

<div class="box">
  <h3>🏁 レース</h3>
  <div id="race"></div>
</div>

<div class="box" id="historyBox"></div>

<pre id="log"></pre>

<script>
/* ===== 設定 ===== */
const N=10;
const TARGET_SECONDS=15;
const MIN_BET=100;
const STEP=100;
const KEY="keiba_next_btn_v1";
const HISTORY_KEEP=10;

/* ===== util ===== */
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const rand=n=>Math.floor(Math.random()*n);
const yen=n=>Math.floor(n);
const nowStr=()=>new Date().toLocaleString();

/* ===== 保存（所持金 + 履歴） ===== */
let state={
  players:[{name:"P1",money:1500,dead:false},{name:"P2",money:1500,dead:false},{name:"P3",money:1500,dead:false}],
  history:[]
};
try{
  const raw=localStorage.getItem(KEY);
  if(raw){
    const d=JSON.parse(raw);
    if(d?.players) state.players=d.players;
    if(d?.history) state.history=d.history;
  }
}catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

/* ===== 馬名生成（オッズ表と賭け用） ===== */
const syll=["サン","ライ","ブレ","ファ","ド","ル","カ","グ","ナ","ト","キ","ラ","ス","セイ","ユウ","オウ","シン","マル","テツ","ヒメ","ミヤ","アキ","ホシ","カゼ","ツキ","ユメ"];
function genName(){ let s=""; const parts=2+rand(2); for(let i=0;i<parts;i++) s+=syll[rand(syll.length)]; return s; }
function uniqueNames(n){ const set=new Set(); while(set.size<n) set.add(genName()); return [...set]; }

/* ===== UI ===== */
function drawPlayers(){
  let html=`<h3>💰 所持金</h3>`;
  state.players.forEach(p=>{
    const tag=(p.money<=0||p.dead)?`<span class="tag bad">ゲームオーバー</span>`:`<span class="tag ok">参加中</span>`;
    html+=`<div>${p.name}：<b>${p.money}</b>円 ${tag}</div>`;
  });
  document.getElementById("playersBox").innerHTML=html;
}
function renderHistory(){
  const h=state.history.slice(-HISTORY_KEEP).reverse();
  let html=`<h3>🧾 履歴</h3>`;
  if(!h.length){ html+=`<div class="muted">まだありません。</div>`; document.getElementById("historyBox").innerHTML=html; return; }
  html+=`<table class="table"><thead><tr><th>日時</th><th>1着</th><th>2着</th><th>3着</th></tr></thead><tbody>`;
  h.forEach(r=>{ html+=`<tr><td>${r.when}</td><td>${r.top3[0]}</td><td>${r.top3[1]}</td><td>${r.top3[2]}</td></tr>`; });
  html+=`</tbody></table>`;
  document.getElementById("historyBox").innerHTML=html;
}

/* ===== 現在レース ===== */
let horses=[];
let dist=1600;
let cardReady=false, bettingClosed=false;
let lockedBets=[];
let finishPlan=[]; // 秒
let finishAt=[];   // performance.now()
let raf=null, startT=null, lastT=null, bgx=0;

/* ===== オッズ ===== */
function makeOdds(hs){
  const scores=hs.map(h=>Math.log(h.power)+(Math.random()*2-1)*0.22);
  const order=[...hs.keys()].sort((a,b)=>scores[b]-scores[a]);

  const FAV_MAX=3.0;
  const LAST_MIN=150.0;

  const last=LAST_MIN+Math.random()*70;
  const fav =2.0+Math.random()*1.0;
  const mid =26 +Math.random()*28;

  const pow=1.22;
  const jitter=()=>Math.exp((Math.random()*2-1)*0.10);

  let byRank=new Array(10).fill(0);
  for(let r=0;r<10;r++){
    const t=r/9;
    const a=Math.pow(mid/fav, Math.pow(t,pow));
    const b=Math.pow(last/mid, Math.pow(t,pow+0.22));
    let odd=fav*a*b*jitter();
    if(r===0) odd=Math.min(FAV_MAX, odd);
    if(r===9) odd=Math.max(LAST_MIN, odd);
    byRank[r]=odd;
  }
  for(let r=1;r<10;r++){
    const minGap=(r<=2)?0.2:(r<=5)?1.5:(r<=7)?4.0:6.0;
    byRank[r]=Math.max(byRank[r], byRank[r-1]+minGap);
  }
  byRank[0]=Math.min(FAV_MAX, byRank[0]);
  byRank[9]=Math.max(LAST_MIN, byRank[9]);

  order.forEach((hid,rpos)=> hs[hid].winOdd=Number(clamp(byRank[rpos],1.1,999.9).toFixed(1)));

  const pop=[...hs].sort((a,b)=>a.winOdd-b.winOdd);
  const rmap=new Map(); pop.forEach((h,i)=>rmap.set(h.id,i+1));
  hs.forEach(h=>{
    const r=rmap.get(h.id);
    let po=1+(h.winOdd-1)*(0.26+Math.random()*0.10);
    po*=(0.95+(r-1)*0.02);
    po*=(0.95+Math.random()*0.08);
    h.placeOdd=Number(clamp(po,1.1,35).toFixed(2));
  });
}

function renderOdds(){
  const sorted=[...horses].sort((a,b)=>a.winOdd-b.winOdd);
  let html=`<h3>📊 オッズ（人気順）</h3>
    <table class="table"><thead><tr>
      <th>人気</th><th>馬番</th><th>馬名</th><th class="right">単勝</th><th class="right">複勝</th>
    </tr></thead><tbody>`;
  sorted.forEach((h,i)=>{
    html+=`<tr><td>${i+1}</td><td>${h.id+1}</td><td>${h.name}</td>
      <td class="right"><b>${h.winOdd}</b>倍</td><td class="right"><b>${h.placeOdd}</b>倍</td></tr>`;
  });
  html+=`</tbody></table>`;
  document.getElementById("oddsBox").innerHTML=html;
}

/* ===== 賭け ===== */
function minBetFor(m){ if(m<=0) return 0; return (m>=MIN_BET)?MIN_BET:m; }
function normalizeBet(m,v){
  if(m<=0) return 0;
  let x=Number(v); if(!Number.isFinite(x)||x<0) x=0;
  const step=(m>=MIN_BET)?STEP:1;
  x=Math.floor(x/step)*step;
  if(x>m) x=m;
  if(m>=MIN_BET){
    if(x>0 && x<MIN_BET) x=MIN_BET;
    if(x>m) x=0;
  }else{
    if(x>0 && x<m) x=m;
  }
  return x;
}
function distinctDefaults(){
  const used=new Set();
  const pick=()=>{ let h=rand(N),g=0; while(used.has(h)&&g<50){h=rand(N);g++;} used.add(h); return h; };
  return [
    {horse:pick(), type:Math.random()<0.5?"win":"place"},
    {horse:pick(), type:Math.random()<0.5?"win":"place"},
    {horse:pick(), type:Math.random()<0.5?"win":"place"},
  ];
}
function horseOptions(){
  return horses.map(h=>`<option value="${h.id}">${h.id+1} ${h.name}（単${h.winOdd}/複${h.placeOdd}）</option>`).join("");
}
function renderBets(){
  const opts=horseOptions();
  const defs=distinctDefaults();
  let html="";
  state.players.forEach((p,pi)=>{
    const dead=(p.money<=0||p.dead);
    const disabled=(bettingClosed||dead)?"disabled":"";
    const tag=bettingClosed?`<span class="tag bad">締切</span>`:(dead?`<span class="tag bad">GO</span>`:`<span class="tag ok">受付</span>`);
    const defAmt=minBetFor(p.money);

    html+=`<div class="box" style="margin:8px 0">
      <div><b>${p.name}</b>（所持金：${p.money}円） ${tag}</div>
      <div class="row" style="margin-top:6px">
        <label>券種
          <select id="type${pi}" ${disabled}>
            <option value="win"${defs[pi].type==="win"?" selected":""}>単勝</option>
            <option value="place"${defs[pi].type==="place"?" selected":""}>複勝</option>
          </select>
        </label>
        <label>馬
          <select id="horsePick${pi}" ${disabled}>${opts}</select>
        </label>
        <label>金額
          <input id="amt${pi}" ${disabled} type="number" inputmode="numeric"
                 min="0" step="${p.money>=MIN_BET?STEP:1}" value="${defAmt}">
        </label>
      </div>
      <div id="warn${pi}" class="muted" style="margin-top:4px"></div>
    </div>`;
  });
  document.getElementById("betBox").innerHTML=html;

  state.players.forEach((p,pi)=>{
    const sel=document.getElementById("horsePick"+pi);
    if(sel) sel.value=String(defs[pi].horse);
    validateBet(pi);
    const amt=document.getElementById("amt"+pi);
    if(amt) amt.oninput=()=>validateBet(pi);
  });
}
function validateBet(pi){
  const p=state.players[pi];
  const warn=document.getElementById("warn"+pi);
  const amt=document.getElementById("amt"+pi);
  if(!p||!warn||!amt) return;
  if(p.money<=0||p.dead){ warn.textContent="この人はゲームオーバーです。"; return; }
  let v=normalizeBet(p.money, amt.value);
  if(v<=0){ v=minBetFor(p.money); warn.textContent=`自動で ${v}円 にしました（賭け必須）`; }
  else warn.textContent="";
  amt.value=v;
}
function renderLocked(){
  const box=document.getElementById("lockedBox");
  if(!lockedBets.length){ box.innerHTML=bettingClosed?`<span class="tag bad">賭けなし</span>`:""; return; }
  box.innerHTML = `<span class="tag">🔒 ロック済み</span><div style="margin-top:6px">${
    lockedBets.map(b=>`${state.players[b.pi].name}：${b.type==="win"?"単勝":"複勝"} ${b.horseLabel} ${b.stake}円（${b.odd}倍）`).join("<br>")
  }</div>`;
}

/* ===== レーン（馬番だけ） ===== */
function renderRaceLanes(){
  const badgeColor=(i)=>`hsl(${(i*36)%360} 85% 45%)`;
  let html="";
  horses.forEach(h=>{
    html+=`<div class="laneBox" style="--badge:${badgeColor(h.id)}">
      <div class="laneHead">${h.id+1}</div>
      <div id="track${h.id}" class="track" style="--bgx:0px">
        <div class="finish"></div>
        <div id="horse${h.id}" class="horse">🐎</div>
      </div>
    </div>`;
  });
  document.getElementById("race").innerHTML=html;
  horses.forEach(h=>setHorseX(h.id,0,0,true));
}

/* 左→右に動かす（文字は反転させない） */
function setHorseX(id,p01,s01,init=false){
  const x=clamp(p01,0,0.96)*100;
  const horse=document.getElementById("horse"+id);
  if(!horse) return;

  const bob = init?0:Math.sin((p01*60)+(performance.now()/85))*(2+s01*6);
  const tilt = init?0:(-2+s01*4);
  const scale = 1 + s01*0.06;

  horse.style.left = x+"%";
  horse.style.transform = `translateY(${bob*0.35}px) rotate(${tilt}deg) scale(${scale})`;
}

/* ===== レース準備（オッズを作る） ===== */
function makeCard(){
  stopRace();

  const names=uniqueNames(N);
  horses = Array.from({length:N},(_,i)=>({
    id:i,
    name:names[i],
    power:1.2+Math.random()*8.5,
    winOdd:0, placeOdd:0,
    lastDisp:0
  }));
  makeOdds(horses);

  dist=1000+rand(1400);
  document.getElementById("infoBox").innerHTML = `<h3>📌 レース条件</h3>距離：<b>${dist}m</b> <span class="tag">約${TARGET_SECONDS}秒</span>`;

  const scores=horses.map(h=>Math.log(h.power));
  const minS=Math.min(...scores), maxS=Math.max(...scores);
  const norm=s=>(maxS===minS)?0.5:(s-minS)/(maxS-minS);

  finishPlan = horses.map(h=>{
    const t=norm(Math.log(h.power));
    let base = TARGET_SECONDS*(1.05 - t*0.13) + (Math.random()*2-1)*0.6;
    return clamp(base, TARGET_SECONDS*0.90, TARGET_SECONDS*1.07);
  });
  finishAt = new Array(N).fill(0);

  cardReady=true;
  bettingClosed=false;
  lockedBets=[];
  bgx=0; startT=null; lastT=null;

  document.getElementById("btnStart").disabled=false;
  document.getElementById("btnStart").textContent="レース開始（締切）";
  document.getElementById("btnNext").disabled=true;

  document.getElementById("log").textContent="賭けてから「レース開始」を押してね。";

  renderOdds();
  renderBets();
  renderLocked();
  renderRaceLanes();
}

/* ===== 次へ（次のオッズ作成） ===== */
function nextRace(){
  // 次のレース（次のオッズ）を作る
  makeCard();
}

/* ===== ロック＆開始時に賭け金を引く ===== */
function lockBetsAndDeduct(){
  lockedBets=[];
  state.players.forEach((p,pi)=>{
    if(p.money<=0||p.dead) return;
    const type=document.getElementById("type"+pi)?.value ?? "win";
    const horseId=Number(document.getElementById("horsePick"+pi)?.value);
    const amtIn=document.getElementById("amt"+pi)?.value ?? "0";
    if(!Number.isFinite(horseId)||horseId<0||horseId>=N) return;

    let stake=normalizeBet(p.money, amtIn);
    if(stake<=0) stake=minBetFor(p.money);
    stake=Math.min(stake, p.money);
    if(stake<=0) return;

    p.money -= stake;
    const h=horses[horseId];
    const odd=(type==="win")?h.winOdd:h.placeOdd;

    lockedBets.push({pi,type,horseId,stake,odd,horseLabel:`${horseId+1} ${h.name}`});
  });

  state.players.forEach((_,pi)=>{
    ["type","horsePick","amt"].forEach(prefix=>{
      const el=document.getElementById(prefix+pi);
      if(el) el.disabled=true;
    });
  });

  drawPlayers();
  save();
}

/* ===== レース開始 ===== */
function startRace(){
  if(!cardReady||!horses.length||raf) return;

  bettingClosed=true;
  state.players.forEach((_,pi)=>validateBet(pi));
  lockBetsAndDeduct();

  if(!lockedBets.length){
    document.getElementById("log").textContent="賭けがありません。";
    bettingClosed=false;
    return;
  }

  renderLocked();
  document.getElementById("btnStart").disabled=true;
  document.getElementById("btnStart").textContent="レース中…";
  document.getElementById("btnNext").disabled=true;

  horses.forEach(h=>h.lastDisp=0);
  finishAt.fill(0);
  bgx=0; startT=null; lastT=null;

  document.getElementById("log").textContent="レース中…";
  raf=requestAnimationFrame(step);
}

function easeOutCubic(x){ x=clamp(x,0,1); return 1-Math.pow(1-x,3); }

/* ★確実に走る：時間ベース＋単調増加＋最低増分 */
function step(ts){
  if(!startT) startT=ts;
  if(!lastT) lastT=ts;
  const dt=(ts-lastT)/1000;
  lastT=ts;

  const elapsed=(ts-startT)/1000;

  const leaderEst = 1/Math.max(1, Math.min(...finishPlan));
  bgx -= (leaderEst*1100)*dt;
  for(let i=0;i<N;i++){
    const tr=document.getElementById("track"+i);
    if(tr) tr.style.setProperty("--bgx", `${bgx}px`);
  }

  let finished=0;
  for(const h of horses){
    const finT=finishPlan[h.id];
    let base=easeOutCubic(elapsed/finT);
    const wob=(Math.random()*2-1)*0.012*(1-base);
    let disp=clamp(base+wob,0,1);

    disp=Math.max(disp, h.lastDisp + 0.0006);
    if(disp>1) disp=1;
    h.lastDisp=disp;

    const s01=clamp((TARGET_SECONDS/finT)*0.45,0,1);
    setHorseX(h.id, disp, s01);

    if(disp>=1){
      finished++;
      if(!finishAt[h.id]) finishAt[h.id]=performance.now();
    }
  }

  if(finished>=N || elapsed>=Math.max(...finishPlan)+0.4){
    finishRace();
    return;
  }
  raf=requestAnimationFrame(step);
}

/* ===== 終了＆精算 ===== */
function finishRace(){
  stopRace();

  const order=[...horses].sort((a,b)=>finishAt[a.id]-finishAt[b.id]);
  const first=order[0], second=order[1], third=order[2];
  const top3=new Set([first.id, second.id, third.id]);

  let out="🏁 結果\n";
  order.forEach((h,i)=>out+=`${i+1}着：${h.id+1} ${h.name}\n`);
  out += `\n【精算】開始時に賭け金を引いています。的中したら (賭け金×倍率) が戻ります。\n`;

  for(const b of lockedBets){
    const p=state.players[b.pi];
    if(!p||p.dead) continue;

    const hit=(b.type==="win") ? (b.horseId===first.id) : top3.has(b.horseId);

    if(hit){
      const payout=yen(b.stake*b.odd);
      p.money += payout;
      out += `・${p.name}：${b.type==="win"?"単勝":"複勝"} ${b.horseLabel} ${b.stake}円 → 的中 払戻${payout}円\n`;
    }else{
      out += `・${p.name}：${b.type==="win"?"単勝":"複勝"} ${b.horseLabel} ${b.stake}円 → ハズレ\n`;
    }

    if(p.money<=0){
      p.money=0; p.dead=true;
      out += `  → ${p.name} は 0円でゲームオーバー\n`;
    }
  }

  state.history.push({
    when: nowStr(),
    top3: [`${first.id+1} ${first.name}`,`${second.id+1} ${second.name}`,`${third.id+1} ${third.name}`]
  });
  if(state.history.length>60) state.history=state.history.slice(-60);

  document.getElementById("log").textContent = out + "\n\n👉「次へ（次のオッズ）」を押すと次のレースを作るよ。";

  drawPlayers();
  renderHistory();
  save();

  // 次へを有効化（ここが要望）
  cardReady=false;
  bettingClosed=false;
  lockedBets=[];
  document.getElementById("btnStart").disabled=true;
  document.getElementById("btnStart").textContent="レース開始（締切）";
  document.getElementById("btnNext").disabled=false;
}

/* ===== stop/reset ===== */
function stopRace(){
  if(raf){ cancelAnimationFrame(raf); raf=null; }
  startT=null; lastT=null;
}
function resetAll(){
  stopRace();
  try{ localStorage.removeItem(KEY); }catch(e){}
  location.reload();
}

/* ===== 初回：自動でオッズ作成 ===== */
window.addEventListener("DOMContentLoaded", ()=>{
  drawPlayers();
  renderHistory();
  makeCard(); // ←最初から作る
});
</script>
